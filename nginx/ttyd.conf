# TOS platform nginx include — serves the ttyd web terminal inside the TOS
# desktop floating window (iframe mode, config.ini path=/ttyd/).
# ttyd builds its WebSocket/token URLs from window.location.pathname, so a
# prefix-stripping proxy works out of the box; WebSocket upgrade headers are
# required (the terminal is a long-lived ws connection).
location /ttyd/ {
    proxy_pass http://127.0.0.1:18231/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
